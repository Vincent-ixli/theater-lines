      },
      "next": {
        "speaker": "旁白D",
        "text": "我读过一则肝片广告，上面列了十几种症状。我数了数，发现自己至少中了九种。于是我又网罗来所有的购药广告，从伤寒到舞蹈病，从霍乱到白喉，每一页都在写我。唯一没得上的是膝盖骨囊炎。（摸摸膝盖，遗憾状）这倒是有点可惜，连买药的资格都没有，这有什么意思。如果我把所有的病都得了，我就能买下药店里所有的药品。于是我每天起床第一件事，就是虔诚地摸一摸膝盖，盼着它快点疼起来。今天它还没有征兆。"
      },
      "stage_before": ""

      ],
      "text": "我读过一则肝片广告，上面列了十几种症状。我数了数，发现自己至少中了九种。于是我又网罗来所有的购药广告，从伤寒到舞蹈病，从霍乱到白喉，每一页都在写我。唯一没得上的是膝盖骨囊炎。（摸摸膝盖，遗憾状）这倒是有点可惜，连买药的资格都没有，这有什么意思。如果我把所有的病都得了，我就能买下药店里所有的药品。于是我每天起床第一件事，就是虔诚地摸一摸膝盖，盼着它快点疼起来。今天它还没有征兆。",
      "para": 653,
      "uncertain": false,
      "note": "",
      "prev": {
        "speaker": "旁白B",
        "text": "我有病，不治身亡。（倒地）（众人哭泣）"
      },
      "next": {
        "speaker": "旁白C",
        "text": "连医生也不知道给我开什么药才好，他说我赚得太少，同时想得太多，这两种病治一个就够了。赚钱的时候我总想着自由。可也不能没有工作，所以我用赚来的钱去旅游，听上去多美妙！每天我挤上写字楼的电梯，想象到了月底我就将要爬上老君山，山顶的风沁人心脾；坐在会议室，我想放了假从民宿的落地窗望出去，正对着的地方就将是大海，海浪有着温柔的呼吸；凌晨我终于瘫倒在公寓楼，我几乎感觉到自己躺在麦子地里，月亮照我如照一口井……我总以为到了月底我就自由了，花钱去旅行我就自由了，如果不去看我的账单我就自由了。我的生活只有两个部分，想象远方和还钱。医生看了我的日记，说我的确每个月去旅游一次，翻着我的朋友圈，九宫格配文“人生是旷野”，我是不是得了癔症？我赚的钱明明不够买到自由……"

      "uncertain": false,

function ellipsisLast(t,lim=155){ if(!t)return '';return t.length>lim?'…'+t.slice(-lim):t; }
function ellipsisFirst(t,lim=155){ if(!t)return '';return t.length>lim?t.slice(0,lim)+'…':t; }
function detailLine(o,cut='last'){if(!o)return '<span class="mini">本部分开场 / 无上一句</span>';let t=o.text;if(t.length<210)return `<div><span class="cue-speaker">${esc(o.speaker)}</span><div class="fulltext">${esc(t)}</div></div>`;return `<div><span class="cue-speaker">${esc(o.speaker)}</span><div class="fulltext">${esc(cut==='last'?ellipsisLast(t,165):ellipsisFirst(t,165))}</div><details class="more"><summary>展开完整${cut==='last'?'上':'下'}一句</summary><div class="fulltext">${esc(t)}</div></details></div>`;}
function clauses(text){return text.split(/[，。！？!?,；;：:\n]+/).map(x=>x.replace(/[（(].*?[)）]/g,'').trim()).filter(Boolean);}
function mnemonic(d){
 const seg=clauses(d.text), main=seg.length>7?[...seg.slice(0,3),...seg.slice(-2)]:seg;
 const chunks=main.map(s=>s.length>16?s.slice(0,13)+'…':s).slice(0,7);
 const cue=d.prev?ellipsisLast(d.prev.text,17):'本幕开场';
 const first=d.text.replace(/^[（(].*?[)）]/,'').slice(0,12);
 return `<div class="memorize"><div class="hinttitle"><strong>记忆钩子 · 根据原文自动拆句</strong><span class="mini">非原剧台词</span></div><div class="tip" style="margin-top:7px">听到「${esc(cue)}」→ 立即接「${esc(first)}」。${d.text.length>90?'长台词先背顺序，再补细节。':'先记起句和动作，熟悉后整句接上。'}</div><div class="steps">${chunks.map((s,i)=>`<span class="step">${i+1} ${esc(s)}</span>`).join('')}</div>${d.text.length>110?`<div class="tip">本句约 ${d.text.length} 字，推荐先分 ${Math.max(2,Math.ceil(d.text.length/40))} 小段，最后一次连续说完。</div>`:''}</div>`;
}

 else queue=matches.map(x=>x.id);
 if(which==='random')for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}

 }else if(scenePhase==='speaker'){
 body+=`<div class="answer"><span class="small-label">我刚说完 · ${esc(speakerLabel(d))}</span><p>${esc(d.text)}</p></div>`;
 if(!samePart){body+=`<div class="notice">本部分结束，没有下一句接话题。</div><button id="sceneStep" class="button full" style="margin-top:12px">${next?'进入下一部分':'完成这一轮'}</button>`;}
 else{
 const options=new Map(play.roles.map(r=>['roles:'+r,castName(r)]));
 sceneLines.filter(x=>x.part===d.part&&(lineRoles(x).length!==1||lineUncertain(x))).forEach(x=>options.set(speakerKey(x),speakerLabel(x)));
 options.set(speakerKey(next),speakerLabel(next));
 body+=`<h3>你说完这句，接下来是谁说？</h3><div class="row" style="flex-wrap:wrap">${[...options].map(([k,l],i)=>`<button class="button secondary speaker-option" data-choice="${esc(k)}" ${speakerChoice!==null?'disabled':''}>${esc(l)}</button>`).join('')}</div>`;
 if(speakerChoice!==null){body+=`<div class="notice" role="status">${speakerChoice===speakerKey(next)?'答对了！':'这次接话的是：'+esc(speakerLabel(next))}${lineUncertain(next)?'。这里只按原稿称呼判断，参与者仍待核实。':''}</div>`;
 body+=lineRoles(next).includes(role)?'<p class="tip">下一句你也参与，先保留台词，继续背下一句。</p>':`<div class="answer"><span class="small-label">接下来 · ${esc(speakerLabel(next))}</span><p>${esc(next.text)}</p>${stageTitle(next)}</div>`;
 body+='<button id="sceneAfterChoice" class="button full" style="margin-top:12px">继续 →</button>';}
 }
 }else{
 body+=`<div class="cue"><span class="cue-label">顺着剧情读 · ${esc(speakerLabel(d))}</span><div class="fulltext cue-text">${esc(d.text)}</div></div>${stageTitle(d)}<p class="fine">这一句不用背，也不用判断说话人。看看对方怎样回应，理解自己的下一句为什么出现。</p><button id="sceneStep" class="button full">${next&&lineRoles(next).includes(role)?'轮到我了 · 开始背词':next?'继续读下一句 →':'完成这一轮'}</button>`;
 }
 body+='<div class="navrow"><button class="quiet" id="sceneJump">跳到我的下一句 →</button><button class="quiet" id="sceneExit">返回接口背词</button></div>';
 main.innerHTML=body;
 bind('scenePeek',()=>{sceneAnswer=true;renderPractice();});bind('sceneHint',()=>{sceneHint=!sceneHint;renderPractice();});
 bind('sceneNo',()=>{grades[role+':'+d.id]='no';writeStore(':grades',grades);sceneAnswer=true;renderPractice();});
 bind('sceneYes',()=>{grades[role+':'+d.id]='yes';writeStore(':grades',grades);scenePhase='speaker';speakerChoice=null;renderPractice();});
 bind('sceneReady',()=>{scenePhase='speaker';speakerChoice=null;renderPractice();});
 main.querySelectorAll('.speaker-option').forEach(el=>el.onclick=()=>{speakerChoice=el.dataset.choice;renderPractice();});
 bind('sceneAfterChoice',()=>sceneMove(scenePos+(lineRoles(next).includes(role)?1:2)));
 bind('sceneStep',()=>sceneMove(scenePos+1));bind('sceneJump',sceneJump);bind('sceneExit',()=>makeQueue('all'));
}

function init(){
 if(!play){$('importView').classList.remove('hidden');$('importView').textContent='内置题库加载失败，请重新下载剧组共享版本。';return;}
 if(!play.roles.includes(role))role=play.roles[0];if(!allActs.includes(act))act='全剧';
 $('roleSelect').innerHTML=play.roles.map(r=>`<option value="${esc(r)}">${esc(castName(r))}</option>`).join('');$('roleSelect').value=role;
 $('actSelect').innerHTML=allActs.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');$('actSelect').value=act;
 $('roleSelect').onchange=ev=>{role=ev.target.value;persistSelector();};$('actSelect').onchange=ev=>{act=ev.target.value;persistSelector();};
 $('searchCue').oninput=ev=>{query=ev.target.value.trim();makeQueue(mode==='wrong'?'wrong':'all');};
 $('combinedMode').onclick=startCombined;
 $('allMode').onclick=()=>makeQueue('all');$('wrongMode').onclick=()=>makeQueue('wrong');$('randomMode').onclick=()=>makeQueue('random');
 $('resetGrade').onclick=()=>{if(confirm(`清空${castName(role)}的全部成绩？`)){for(let k of Object.keys(grades)){if(k.startsWith(role+':'))delete grades[k];}writeStore(':grades',grades);makeQueue('all');}};
 $('exportGrade').onclick=()=>{let rows=['角色,原文接口号,部分,结果,上一句,台词'];for(let d of play.lines){let score=grades[role+':'+d.id];if(score)rows.push([role,d.id,d.part,score,d.prev?d.prev.speaker+'：'+d.prev.text:'',d.text].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','));}downloadText(`${roleNames[role]}_练习成绩.csv`,rows.join('\n'),'text/csv;charset=utf-8');};
 $('navPractice').onclick=()=>renderPractice();$('navReview').onclick=showReview;$('navManage').onclick=showManage;
 makeQueue('all');
}
init();
})();

</script>
</body>
</html>
